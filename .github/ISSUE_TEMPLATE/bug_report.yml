name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "e.g. v2.0.0"
    validations:
      required: true

  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "e.g. 12.4.0"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "e.g. 8.3.1"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, or a link to a minimal repo, that reproduces the issue.
      placeholder: |
        1. Configure '...'
        2. Call '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output / stack trace
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I've searched existing issues and this hasn't been reported before
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md instead)
          required: true
